# Values for the stable release the upgrade test installs first. That
# release's CiliumNetworkPolicy has an empty DNS port list, which the
# CiliumNetworkPolicy CRD rejects, so it is turned off here. That release also
# puts its PolicyExceptions in the giantswarm namespace, which the kind cluster
# does not have. The upgrade to the chart under test uses the chart defaults.
# Drop this file once a release with the fix is out.
kyvernoPolicyExceptions:
  namespace: policy-exceptions
ciliumNetworkPolicy:
  enabled: false
